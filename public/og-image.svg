<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#16294d"/>
      <stop offset="100%" style="stop-color:#0d1b33"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#c4a035;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#c4a035;stop-opacity:0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <!-- Grid pattern -->
  <g opacity="0.03" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>
  <!-- Color swatches -->
  <g transform="translate(900, 380)">
    <circle cx="0" cy="0" r="45" fill="#D4AF37" opacity="0.9"/>
    <circle cx="100" cy="0" r="45" fill="#C0C0C0" opacity="0.9"/>
    <circle cx="50" cy="-70" r="45" fill="#B76E79" opacity="0.9"/>
    <circle cx="50" cy="70" r="45" fill="#1A1A1A" opacity="0.9"/>
  </g>
  <!-- Brand text -->
  <text x="80" y="200" fill="#c4a035" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="600" letter-spacing="3">CHINA GLITTER FABRIC MANUFACTURER</text>
  <text x="80" y="290" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="72" font-weight="800">Nixia Fabric</text>
  <text x="80" y="360" fill="rgba(255,255,255,0.7)" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="400">Glitter Fabric &amp; Foil Fabric Manufacturer</text>
  <text x="80" y="410" fill="rgba(255,255,255,0.5)" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="400">OEM Production · Custom Color Development</text>
  <!-- Bottom badges -->
  <g transform="translate(80, 480)">
    <rect x="0" y="0" width="140" height="40" rx="20" fill="none" stroke="rgba(196,160,53,0.4)" stroke-width="1.5"/>
    <text x="70" y="26" fill="#c4a035" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Manufacturer</text>
    <rect x="160" y="0" width="90" height="40" rx="20" fill="none" stroke="rgba(196,160,53,0.4)" stroke-width="1.5"/>
    <text x="205" y="26" fill="#c4a035" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Factory</text>
    <rect x="270" y="0" width="80" height="40" rx="20" fill="none" stroke="rgba(196,160,53,0.4)" stroke-width="1.5"/>
    <text x="310" y="26" fill="#c4a035" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle">OEM</text>
  </g>
</svg>
